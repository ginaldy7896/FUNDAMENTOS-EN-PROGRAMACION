        body { background-color: #080C14; color: #F8FAFC; font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        .cyber-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid #1E293B; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8); }
        .cyber-card-glow { border-color: #06B6D4; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .speech-bubble { position: relative; background: #1E293B; border: 2px solid #06B6D4; border-radius: 1rem; }
        .speech-bubble::after { content: ''; position: absolute; left: -14px; top: 24px; border-width: 8px 14px 8px 0; border-style: solid; border-color: transparent #06B6D4 transparent transparent; display: block; width: 0; }

        @keyframes pop-in { 0% { transform: scale(.4) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.12) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .screen > .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 5rem 1.5rem 1.5rem; }

        select.sel, input.txt { background: #0F172A; border: 1px solid #334155; border-radius: .5rem; color: #67E8F9; font-family: 'Fira Code', monospace; font-size: .8rem; padding: .5rem .7rem; }
        select.sel { max-width: 60%; }
        input.txt { width: 100%; }

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LV = [
{ n:"Nivel 1: La señal perdida", m:"Misión 1 — Analiza el problema", t:"Análisis y variables", b:"Analista del sistema",
  i:"El sistema está recibiendo información, pero no sabe cómo procesarla. Antes de escribir código, necesitas comprender qué datos entran, qué debe hacer el programa y qué resultado se espera.",
  st:["El módulo de monitoreo ha dejado de generar resultados confiables. Tu primera tarea consiste en recuperar la información de un sensor y determinar cómo debe procesarse.",
      "El sensor registra una temperatura. El sistema debe guardar ese dato, analizarlo y mostrar un mensaje indicando si la temperatura es normal o requiere revisión.",
      "Antes de programar, identifica los elementos del problema."],
  retos:[
    { h:"Reto 1 · Entradas, proceso y salida", q:"El sistema recibe una temperatura de 32, la compara con un límite de 30 y muestra una alerta si alcanza o supera ese límite. ¿Cuál opción identifica correctamente los elementos del problema?",
      o:["Entrada: la alerta. Proceso: mostrar el mensaje. Salida: la temperatura.","Entrada: la temperatura. Proceso: compararla con el límite. Salida: el mensaje del sistema.","Entrada: el mensaje. Proceso: almacenar la alerta. Salida: el límite.","Entrada: el límite. Proceso: mostrar la temperatura. Salida: compararla."],
      a:1,
      ok:"¡Muy bien! Primero se recibe el dato, después se procesa mediante una comparación y finalmente se obtiene una salida. Este análisis permite definir qué debe hacer el programa antes de escribir el código.",
      bad:"Piensa en el orden del proceso: ¿qué información recibe el sistema?, ¿qué operación realiza con ella?, ¿qué resultado entrega?" },
    { h:"Reto 2 · Selecciona la variable correcta", q:"Necesitamos guardar la temperatura 32.5 en Python. ¿Cuál instrucción es la adecuada?",
      o:["temperatura = 32.5","32.5 = temperatura","temperatura == 32.5","print = temperatura"], a:0,
      ok:"¡Correcto! La variable temperatura almacena el valor 32.5. Python lo reconoce como un número decimal de tipo float.",
      bad:"Para asignar un valor a una variable se utiliza =. El nombre va a la izquierda y el valor a la derecha." }
  ],
  act:{ t:"match", rows:[["25",0],["25.5",1],['"Alerta"',2]], opts:["int — entero","float — decimal","str — texto"],
        ok:"¡Datos recuperados! Ya reconoces cómo representar la información que un programa necesita procesar.",
        bad:"Hay datos mal clasificados. Revisa el tipo de cada valor." } },

{ n:"Nivel 2: Reconstruye el algoritmo", m:"Misión 2 — Diseña la solución", t:"Algoritmos y secuencias", b:"Arquitecto de algoritmos",
  i:"Ya tienes los datos del sistema. Ahora necesitas organizar las instrucciones para que el programa sepa qué hacer y en qué orden.",
  st:["El sistema ya puede recibir y almacenar la temperatura, pero sus instrucciones están desordenadas. Si se ejecutan en una secuencia incorrecta, el resultado no será confiable.",
      "Tu misión es reconstruir el algoritmo antes de traducirlo a Python."],
  retos:[
    { h:"Reto 1 · Ordena el procedimiento", q:"¿Cuál es el orden lógico para resolver el problema de la temperatura?",
      o:["Mostrar el resultado → recibir la temperatura → comparar el dato.","Comparar el dato → mostrar el resultado → recibir la temperatura.","Recibir la temperatura → comparar con el límite → mostrar el resultado.","Mostrar el resultado → comparar el dato → recibir la temperatura."], a:2,
      ok:"¡Excelente! Un algoritmo debe seguir una secuencia lógica. Primero obtiene los datos, luego realiza el proceso y finalmente presenta el resultado.",
      bad:"Un programa no puede comparar una temperatura que todavía no ha recibido. Revisa cuál debe ser el primer paso." },
    { h:"Reto 2 · Completa el algoritmo", q:"Algoritmo: 1) Leer la temperatura. 2) ____. 3) Si la temperatura es mayor o igual a 30, mostrar “Revisar temperatura”. 4) En caso contrario, mostrar “Valores normales”. ¿Qué debe ir en el paso 2?",
      o:["Eliminar la temperatura.","Comparar la temperatura con el límite de 30.","Mostrar siempre “Valores normales”.","Volver a leer la temperatura sin analizarla."], a:1,
      ok:"¡Muy bien! La comparación determina qué decisión tomará el sistema. Este paso conecta el análisis del problema con la lógica que después se implementará en Python.",
      bad:"El algoritmo necesita una operación que permita decidir cuál mensaje mostrar según el valor recibido." }
  ],
  act:{ t:"order", items:["Recibir la temperatura.","Guardar el valor en una variable.","Comparar la temperatura con el límite.","Mostrar el mensaje correspondiente."], show:[2,0,3,1],
        ok:"¡Algoritmo reconstruido! Has organizado la solución antes de escribir el programa. Un algoritmo claro facilita la programación y la detección de errores." } },

{ n:"Nivel 3: Programa el sistema", m:"Misión 3 — Escribe el código", t:"Python y condicionales", b:"Programador en acción",
  i:"El algoritmo está listo, pero el sistema necesita instrucciones que pueda ejecutar. Es momento de transformar la solución en código Python.",
  st:["Has recuperado la lógica del sistema. Sin embargo, todavía no puede tomar decisiones automáticamente.",
      "Debes programar una instrucción que almacene el dato, compare su valor con un límite y muestre el mensaje correspondiente."],
  retos:[
    { h:"Reto 1 · Predice el resultado", c:"temperatura = 32\nprint(temperatura)", q:"¿Qué mostrará este código?",
      o:["temperatura","32","print","Un error de sintaxis."], a:1,
      ok:"¡Correcto! La variable almacena el número 32 y print(temperatura) muestra su valor en pantalla.",
      bad:"Cuando escribes el nombre de una variable dentro de print(), Python muestra el valor almacenado, no el nombre de la variable." },
    { h:"Reto 2 · Completa el condicional", q:"Selecciona el código que permite mostrar una alerta cuando la temperatura es igual o superior a 30.",
      o:["if temperatura >= 30:\n    print(\"Revisar temperatura\")\nelse:\n    print(\"Valores normales\")",
         "if temperatura = 30:\n    print(\"Revisar temperatura\")\nelse:\n    print(\"Valores normales\")",
         "if temperatura < 30:\n    print(\"Revisar temperatura\")\nelse:\n    print(\"Valores normales\")",
         "print(\"Revisar temperatura\")\nprint(\"Valores normales\")"], a:0,
      ok:"¡Código correcto! El operador >= significa “mayor o igual que”. El bloque if se ejecuta cuando la condición es verdadera y else cuando es falsa.",
      bad:"Revisa tres aspectos: el operador de comparación, el sentido de la condición y la estructura de if y else. En Python, = asigna un valor y == compara igualdad." },
    { h:"Reto 3 · Recibe un dato", q:"Queremos pedirle al usuario que ingrese una temperatura. ¿Qué instrucción permite recibir un dato por teclado?",
      o:["print(\"Ingrese temperatura\")","input(\"Ingrese temperatura: \")","if(\"Ingrese temperatura\")","int = \"temperatura\""], a:1,
      ok:"¡Bien! input() permite recibir información del usuario. Ten presente que el valor que devuelve es texto; si necesitas hacer operaciones numéricas, debes convertirlo, por ejemplo, con float() o int().",
      bad:"print() muestra información, mientras que input() permite solicitar un dato al usuario." }
  ],
  act:{ t:"fill", c:"temperatura = 32\nif ____:\n    print(\"Revisar temperatura\")\nelse:\n    print(\"Valores normales\")", ans:"temperatura >= 30",
        ok:"¡Sistema programado! Has convertido una condición del problema en una instrucción de Python. El programa puede tomar decisiones de acuerdo con el valor recibido.",
        bad:"Revisa el operador: necesitas comparar con “mayor o igual que”, no asignar un valor." } },

{ n:"Nivel 4: Detecta la falla", m:"Misión 4 — Depura el código", t:"Errores y pruebas", b:"Cazador de errores",
  i:"El sistema ya ejecuta instrucciones, pero un error impide completar la misión. Debes identificar el problema, corregirlo y comprobar que la solución funciona.",
  st:["El módulo de monitoreo ha sido activado, pero aparece un error en el código. El sistema no puede continuar hasta que encuentres la causa.",
      "Analiza las instrucciones y demuestra que puedes identificar errores sin limitarte a copiar código."],
  retos:[
    { h:"Reto 1 · Encuentra el error", c:"temperatura = 32\nif temperatura >= 30\n    print(\"Revisar temperatura\")", q:"¿Qué problema presenta el siguiente fragmento?",
      o:["La variable debe llamarse print.","Falta dos puntos (:) al final de la condición.","La temperatura no puede ser un número.","La función print() no se puede utilizar dentro de if."], a:1,
      ok:"¡Error identificado! En Python, las instrucciones if deben terminar con dos puntos para indicar el inicio del bloque. Código corregido:",
      x:"temperatura = 32\nif temperatura >= 30:\n    print(\"Revisar temperatura\")",
      bad:"Revisa la línea de la condición. Python utiliza dos puntos para señalar el inicio de un bloque de instrucciones." },
    { h:"Reto 2 · Comprueba el resultado", c:"temperatura = 25\nif temperatura >= 30:\n    print(\"Revisar temperatura\")\nelse:\n    print(\"Valores normales\")", q:"¿Qué mensaje aparecerá?",
      o:["Revisar temperatura","Valores normales","25","No aparece ningún mensaje."], a:1,
      ok:"¡Prueba superada! Como 25 >= 30 es falso, Python ejecuta el bloque else y muestra “Valores normales”.",
      bad:"Sustituye la variable por su valor: ¿es 25 mayor o igual a 30? La respuesta determina qué bloque se ejecuta." },
    { h:"Actividad práctica · Paso 1 · Corrige", c:"puntos = 15\nif puntos >= 10\n    print(\"Misión completada\")\nelse:\n    print(\"Intenta de nuevo\")", q:"¿Qué debes hacer para que el código funcione?",
      o:["Añadir dos puntos al final de if puntos >= 10.","Cambiar el valor de puntos a 10.","Eliminar la instrucción else.","Escribir print antes de if."], a:0,
      ok:"¡Correcto! Sin los dos puntos, Python no reconoce el inicio del bloque del if.",
      bad:"Revisa la línea del if: Python necesita un signo al final de la condición para iniciar el bloque." },
    { h:"Actividad práctica · Paso 2 · Prueba", q:"Con puntos = 15, ¿qué resultado se obtiene?",
      o:["Misión completada","Intenta de nuevo","15","No aparece nada."], a:0,
      ok:"¡Sistema restaurado! Has identificado un error de sintaxis y comprobado la lógica del programa. En programación, corregir y probar son pasos fundamentales para conseguir resultados confiables.",
      bad:"Sustituye puntos por 15 y pregunta: ¿es 15 mayor o igual a 10?" }
  ] }
];

const FIN = {
  n:"Desafío final: Recuperación del sistema",
  i:"El sistema central ha recuperado sus módulos, pero necesita que verifiques un programa completo antes de volver a funcionar. Misión: analizar el problema, interpretar el código y comprobar el resultado.",
  s:"Un sistema de monitoreo debe evaluar una lectura de temperatura. Si el valor es igual o superior a 30, debe mostrar una alerta. En caso contrario, debe indicar que los valores son normales.",
  c:"temperatura = 35\nif temperatura >= 30:\n    print(\"Alerta\")\nelse:\n    print(\"Normal\")",
  retos:[
    { h:"Paso 1 · Identifica la entrada", q:"¿Qué dato necesita el programa para resolver el problema?", o:["El mensaje de alerta.","La temperatura registrada.","La respuesta del programa.","El nombre del sistema."], a:1,
      ok:"¡Correcto! La temperatura es la entrada porque es el dato que el programa necesita evaluar.", bad:"Piensa qué dato debe evaluar el programa antes de decidir nada." },
    { h:"Paso 2 · Selecciona la condición", q:"¿Cuál condición representa correctamente la regla del sistema?", o:["temperatura < 30","temperatura == 30","temperatura >= 30","temperatura = 30"], a:2,
      ok:">= incluye los valores mayores que 30 y también el valor 30. La asignación = no sustituye una comparación.", bad:"La regla incluye el 30. Revisa qué operador incluye también el límite." },
    { h:"Paso 3 · Predice el resultado", q:"¿Qué mostrará el programa cuando la temperatura sea 35?", o:["Normal","35","Alerta","No muestra nada."], a:2,
      ok:"¡Correcto! Como 35 es mayor que 30, la condición es verdadera y se ejecuta el bloque if.", bad:"Sustituye temperatura por 35 y evalúa si 35 >= 30 es verdadero o falso." },
    { h:"Paso 4 · Prueba un segundo valor", q:"¿Qué debería mostrar el mismo programa si la temperatura cambia a 20?", o:["Normal","Alerta","20","No muestra nada."], a:0,
      ok:"¡Verificación completada! Has probado el programa con dos valores distintos y comprobado que la condición permite obtener resultados diferentes según la entrada.", bad:"¿Es 20 mayor o igual que 30? Si no lo es, ¿qué bloque se ejecuta?" }
  ] };


/* ===================== ESTADO ===================== */
const KEY = "pyengine-mision-v1";
const COL = ["#06B6D4", "#A855F7", "#10B981", "#F59E0B"];
let S = { v:"intro", L:0, i:0, ok:{}, wr:{}, fb:{}, sel:{}, ord:{}, fi:{} };

try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.ok) S.ok = saved.ok; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ ok: S.ok })); } catch(e) {} }

function getR(k){ const [li,ri]=k.split("."); const L = li==="4" ? FIN : LV[+li]; return L.retos[+ri]; }
function ld(li){
  const L = li===4 ? FIN : LV[li];
  const q = L.retos.every((_,i)=>S.ok[li+"."+i]);
  return q && (li===4 || !L.act || !!S.ok[li+".act"]);
}
function steps(li){
  const L = li===4 ? FIN : LV[li];
  const s = [{t:"story"}];
  L.retos.forEach((_,r)=>s.push({t:"q", k:li+"."+r}));
  if (li<4 && L.act) s.push({t:"act"});
  if (li<4) s.push({t:"badge"});
  return s;
}
function stepDone(li, st){
  if (st.t==="story" || st.t==="badge") return true;
  if (st.t==="q") return !!S.ok[st.k];
  return !!S.ok[li+".act"];
}

/* ===================== NAVEGACIÓN ===================== */
function go(v, L){
  S.v = v;
  if (L !== undefined) { S.L = L; S.i = 0; }
  render();
}
function next(){
  const s = steps(S.L);
  if (!stepDone(S.L, s[S.i])) return;
  if (S.i < s.length - 1) { S.i++; render(); }
  else go(S.L === 4 ? "win" : "map");
}
function prev(){ if (S.i > 0) { S.i--; render(); } }
function render(){
  const f = { intro, map, step, win }[S.v];
  document.getElementById("app").innerHTML = f();
  document.getElementById("screen").scrollTop = 0;
}

/* ===================== PIEZAS VISUALES ===================== */
function pybot(size, mood){
  const arms = `<path d="M 20 50 Q 12 55 18 65" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/><path d="M 80 50 Q 88 55 82 65" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>`;
  return `<div class="${size} relative animate-pybot"><svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_0_20px_rgba(6,182,212,0.8)]">
    <rect x="25" y="40" width="50" height="40" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="3"/>
    <rect x="32" y="47" width="36" height="24" rx="5" fill="#080C14" stroke="#10B981" stroke-width="2"/>
    <circle cx="42" cy="59" r="3.5" fill="#06B6D4" class="animate-pulse"/><circle cx="58" cy="59" r="3.5" fill="#06B6D4" class="animate-pulse"/>
    <line x1="50" y1="40" x2="50" y2="25" stroke="#06B6D4" stroke-width="3"/><circle cx="50" cy="22" r="4" fill="#F59E0B" class="animate-ping"/>${arms}</svg></div>`;
}
function star(cx, cy, R, r){
  let p = [];
  for (let n = 0; n < 10; n++) { const a = -Math.PI/2 + n*Math.PI/5, d = n%2 ? r : R; p.push((cx + d*Math.cos(a)).toFixed(1) + "," + (cy + d*Math.sin(a)).toFixed(1)); }
  return p.join(" ");
}
function medal(li, cls, locked){
  const c = locked ? "#475569" : COL[li];
  return `<svg viewBox="0 0 100 125" class="${cls}" style="${locked?"opacity:.45":`filter:drop-shadow(0 0 12px ${c}99)`}">
    <polygon points="28,0 50,0 60,42 40,52" fill="${c}" opacity=".75"/><polygon points="72,0 50,0 40,42 60,52" fill="${c}"/>
    <circle cx="50" cy="80" r="35" fill="#0F172A" stroke="${c}" stroke-width="5"/>
    <circle cx="50" cy="80" r="27" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>
    ${locked ? `<text x="50" y="90" text-anchor="middle" font-size="26" fill="${c}">🔒</text>` : `<polygon points="${star(50,80,19,8)}" fill="${c}"/>`}
  </svg>`;
}
function trophy(cls){
  return `<svg viewBox="0 0 100 100" class="${cls}" style="filter:drop-shadow(0 0 16px #F59E0Bbb)">
    <path d="M30 12 h40 v28 a20 20 0 0 1 -40 0 z" fill="#F59E0B" stroke="#FDE68A" stroke-width="2"/>
    <path d="M30 20 h-12 v6 a14 14 0 0 0 14 14" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 20 h12 v6 a14 14 0 0 1 -14 14" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <rect x="45" y="60" width="10" height="16" fill="#D97706"/><rect x="32" y="76" width="36" height="9" rx="3" fill="#F59E0B" stroke="#FDE68A" stroke-width="2"/>
    <polygon points="${star(50,34,11,4.8)}" fill="#FEF3C7"/>
  </svg>`;
}
function bar(done, total){
  return `<div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-cyan-500 to-emerald-500 transition-all duration-500" style="width:${total?done/total*100:0}%"></div></div>`;
}
function fbBox(good, msg){
  return good
    ? `<div class="text-xs p-3 rounded-xl border bg-emerald-950/65 border-emerald-500/60 text-emerald-200"><i class="fa-solid fa-circle-check text-emerald-400"></i> <strong>¡Correcto!</strong> ${esc(msg)}</div>`
    : `<div class="text-xs p-3 rounded-xl border bg-red-950/65 border-red-500/60 text-red-200 animate-shake"><i class="fa-solid fa-circle-xmark text-red-400"></i> <strong>Todavía no.</strong> ${esc(msg)}</div>`;
}

/* ===================== PANTALLAS ===================== */
function intro(){
  return `<div class="cyber-card cyber-card-glow max-w-3xl w-full p-6 sm:p-8 rounded-2xl space-y-6 text-center border border-cyan-500/50">
    <div class="flex justify-center">${pybot("w-32 h-32")}</div>
    <div class="space-y-2">
      <span class="text-xs font-mono text-cyan-400 uppercase tracking-widest bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-800">Recurso de gamificación</span>
      <h2 class="text-2xl font-bold text-white">MISIÓN PYTHON: Ingeniería en código</h2>
      <p class="text-slate-400 text-xs">Una misión. Cuatro niveles. Un sistema que necesita tu ayuda.</p>
    </div>
    <div class="speech-bubble p-5 text-left text-xs text-slate-200 leading-relaxed space-y-3">
      <p>El Centro de Sistemas de Ingeniería ha sufrido una falla. Los datos no se procesan correctamente y el sistema no puede completar sus tareas.</p>
      <p>Como integrante del equipo de recuperación, superarás cuatro niveles: analizar problemas, diseñar algoritmos, programar en Python y encontrar errores.</p>
      <p class="text-cyan-300 font-mono"><i class="fa-solid fa-gamepad"></i> Cada reto es una pantalla. Respóndelo bien para avanzar; si fallas, PyBot te da una pista y puedes intentarlo otra vez. Cada nivel completado te da una medalla, y al final recibirás el trofeo.</p>
    </div>
    <button onclick="go('map')" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-bold rounded-xl text-sm transition-all shadow-lg hover:opacity-90 flex items-center justify-center gap-2 font-mono">
      <i class="fa-solid fa-rocket"></i> INICIAR MISIÓN
    </button>
  </div>`;
}

function map(){
  const done = [0,1,2,3].filter(ld).length;
  const th = [["cyan","text-cyan-400","bg-cyan-950"],["purple","text-purple-400","bg-purple-950"],["emerald","text-emerald-400","bg-emerald-950"],["amber","text-amber-400","bg-amber-950"]];
  let h = `<div class="max-w-5xl w-full space-y-6 text-center">
    <div class="flex items-center justify-center gap-4">${pybot("w-16 h-16")}
      <div class="text-left"><h2 class="text-3xl font-extrabold text-white">Mapa de la misión</h2>
      <p class="text-slate-400 text-xs">${done} de 4 niveles completados · avanza en orden para desbloquear el siguiente</p></div></div>
    <div class="max-w-md mx-auto">${bar(done,4)}</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 text-left">`;
  LV.forEach((L,i)=>{
    const un = i===0 || ld(i-1), dn = ld(i), [c,tx,bg] = th[i];
    h += `<button ${un?"":"disabled"} onclick="go('step',${i})" class="cyber-card p-5 rounded-2xl ${un?`hover:border-${c}-400 cursor-pointer hover:scale-[1.02]`:"opacity-60 cursor-not-allowed"} transition-all flex items-center gap-4 border border-slate-800 text-left group">
      <div class="w-16 flex-shrink-0">${medal(i,"w-full",!dn)}</div>
      <div class="space-y-1">
        <span class="text-[11px] font-mono ${tx}">${esc(L.m)}</span>
        <h3 class="text-sm font-bold text-white">${esc(L.n)}</h3>
        <p class="text-[11px] text-slate-400">${esc(L.t)}</p>
        <p class="text-[11px] font-mono ${dn?"text-emerald-400":un?"text-slate-300":"text-slate-500"}">${dn?"✔ "+esc(L.b):un?"▶ Disponible":"🔒 Bloqueado"}</p>
      </div></button>`;
  });
  const fin = done===4;
  h += `</div>
    <button ${fin?"":"disabled"} onclick="go('step',4)" class="cyber-card p-5 rounded-2xl w-full max-w-3xl mx-auto ${fin?"hover:border-amber-400 cursor-pointer hover:scale-[1.01]":"opacity-60 cursor-not-allowed"} transition-all flex items-center gap-4 border border-slate-800 text-left">
      <div class="w-14 flex-shrink-0 ${fin?"":"opacity-40 grayscale"}">${trophy("w-full")}</div>
      <div><h3 class="text-sm font-bold text-white">${esc(FIN.n)}</h3>
      <p class="text-[11px] font-mono ${fin?"text-amber-300":"text-slate-500"}">${fin?"▶ Disponible: consigue el trofeo":"🔒 Completa los cuatro niveles"}</p></div></button>
    <div class="flex justify-center gap-3">
      <button onclick="go('intro')" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-mono rounded-lg border border-slate-700"><i class="fa-solid fa-chevron-left"></i> Introducción</button>
      <a href="../index.html" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-mono rounded-lg border border-slate-700">Volver al inicio</a>
    </div></div>`;
  return h;
}

/* --- contenido de cada tipo de pantalla --- */
function bodyStory(li){
  const L = li===4 ? FIN : LV[li];
  if (li===4) return `<p class="text-sm font-semibold text-white">${esc(L.n)}</p><p class="text-xs text-slate-200 leading-relaxed">${esc(L.i)}</p>
    <p class="text-xs text-cyan-300">${esc(L.s)}</p><pre class="code">${esc(L.c)}</pre>`;
  return `<p class="text-[11px] font-mono text-cyan-400 uppercase">Nivel ${li+1} de 4 · ${esc(L.m)}</p>
    <p class="text-sm font-semibold text-white">${esc(L.n.split(": ")[1])} <span class="text-slate-400 font-normal">· ${esc(L.t)}</span></p>
    <p class="text-xs text-slate-200 leading-relaxed">${esc(L.i)}</p>
    <div class="bg-slate-900 p-3 rounded border border-cyan-800 text-xs text-slate-300 space-y-2"><p class="font-mono text-cyan-300 text-[11px]">📖 HISTORIA DEL NIVEL</p>${L.st.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
}
function bodyQ(k){
  const r = getR(k), done = !!S.ok[k], wr = S.wr[k] || [];
  let h = `<p class="text-[11px] font-mono text-yellow-400">${esc(r.h)}</p><p class="text-sm font-semibold text-white">${esc(r.q)}</p>`;
  if (r.c) h += `<pre class="code">${esc(r.c)}</pre>`;
  h += `<div class="space-y-2 pt-1">`;
  r.o.forEach((t,i)=>{
    let cls = "bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300", dis = "";
    if (done && i===r.a) { cls = "bg-emerald-950/70 border-emerald-500 text-emerald-200"; dis = "disabled"; }
    else if (wr.includes(i)) { cls = "bg-red-950/60 border-red-500/70 text-red-300 line-through opacity-70"; dis = "disabled"; }
    else if (done) { dis = "disabled"; cls += " opacity-50"; }
    h += `<button ${dis} onclick="pick('${k}',${i})" class="opt w-full text-left p-2.5 rounded-lg border text-xs font-mono transition-all ${cls}">${String.fromCharCode(65+i)}) ${esc(t)}</button>`;
  });
  h += `</div>`;
  if (done && r.x) h += `<pre class="code">${esc(r.x)}</pre>`;
  return h;
}
function bodyAct(li){
  const A = LV[li].act, k = li+".act", done = !!S.ok[k];
  if (A.t==="match") {
    const sel = done ? A.rows.map(r=>r[1]) : (S.sel[k] || []);
    let h = `<p class="text-[11px] font-mono text-yellow-400">Actividad práctica · clasifica los datos</p><p class="text-sm font-semibold text-white">Relaciona cada dato con su tipo correcto.</p><div class="space-y-2 pt-1">`;
    A.rows.forEach((row,ri)=>{
      h += `<div class="flex items-center justify-between gap-3 bg-slate-900 border border-slate-800 rounded-lg p-2.5"><code class="text-cyan-300 text-xs">${esc(row[0])}</code>
        <select class="sel" ${done?"disabled":""} onchange="mt2(${li},${ri},this.value)"><option value="">Elige…</option>${A.opts.map((o,j)=>`<option value="${j}" ${sel[ri]===j?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    });
    return h + `</div>`;
  }
  if (A.t==="order") {
    const ord = done ? A.items.map((_,j)=>j) : (S.ord[k] || []);
    let h = `<p class="text-[11px] font-mono text-yellow-400">Actividad práctica · arma la secuencia</p><p class="text-sm font-semibold text-white">Toca los pasos en el orden en que deben ejecutarse.</p>
      <div class="bg-slate-900 p-3 rounded border border-cyan-800 text-xs text-cyan-200 space-y-1"><p class="font-mono text-[11px] text-cyan-400">TU SECUENCIA</p>${ord.length ? ord.map((j,n)=>`<p>${n+1}. ${esc(A.items[j])}</p>`).join("") : '<p class="text-slate-500">—</p>'}</div><div class="space-y-2">`;
    A.show.forEach(j=>{ const used = ord.includes(j);
      h += `<button ${done||used?"disabled":""} onclick="oc(${li},${j})" class="opt w-full text-left p-2.5 rounded-lg border text-xs font-mono transition-all ${used?"bg-slate-950 border-slate-900 text-slate-600":"bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300"}">${esc(A.items[j])}</button>`; });
    h += `</div>`;
    if (!done) h += `<button onclick="orr(${li})" class="px-3 py-1.5 bg-slate-900 text-slate-400 text-xs font-mono rounded-lg border border-slate-700"><i class="fa-solid fa-rotate-left"></i> Reiniciar</button>`;
    return h;
  }
  const val = done ? A.ans : (S.fi[k] || "");
  return `<p class="text-[11px] font-mono text-yellow-400">Actividad práctica · completa el programa</p><p class="text-sm font-semibold text-white">Escribe la condición que falta:</p>
    <pre class="code">${esc(A.c)}</pre>
    <input type="text" id="fi" class="txt" placeholder="Escribe la condición…" ${done?"disabled":""} value="${esc(val)}" onkeydown="if(event.key==='Enter')fc(${li})">
    ${done?"":`<button onclick="fc(${li})" class="px-4 py-2 bg-cyan-500 text-black font-bold text-xs font-mono rounded-lg">Verificar Respuesta</button>`}`;
}
function bodyBadge(li){
  const L = LV[li];
  return `<div class="text-center space-y-3"><p class="text-[11px] font-mono text-emerald-400 uppercase">¡Nivel ${li+1} completado!</p>
    <div class="flex justify-center"><div class="w-32 animate-pop">${medal(li,"w-full",false)}</div></div>
    <p class="text-lg font-extrabold text-white">Medalla: ${esc(L.b)}</p>
    <p class="text-xs text-slate-300">Superaste todos los retos de «${esc(L.n.split(": ")[1])}».</p></div>`;
}

function step(){
  const li = S.L, s = steps(li), st = s[S.i], L = li===4 ? FIN : LV[li];
  const done = stepDone(li, st), last = S.i === s.length-1;
  const fbk = st.t==="q" ? st.k : li+".act";
  const f = S.fb[fbk];
  const isStory = st.t==="story", isBadge = st.t==="badge";
  const body = isStory ? bodyStory(li) : st.t==="q" ? bodyQ(st.k) : st.t==="act" ? bodyAct(li) : bodyBadge(li);
  const label = li===4 ? "Desafío final" : `Nivel ${li+1} · ${L.n.split(": ")[1]}`;
  const status = isStory ? "Lee la historia" : isBadge ? "¡Misión de nivel cumplida!" : done ? "¡Bien hecho! Avanza." : f && !f.good ? "Revisa la pista e inténtalo otra vez" : "Analizando tu respuesta...";
  const nextTxt = last ? (li===4 ? 'Ver el trofeo <i class="fa-solid fa-trophy"></i>' : 'Volver al mapa <i class="fa-solid fa-map"></i>') : isStory ? 'Comenzar <i class="fa-solid fa-chevron-right"></i>' : 'Siguiente <i class="fa-solid fa-chevron-right"></i>';
  return `<div class="max-w-4xl w-full cyber-card p-5 sm:p-6 rounded-2xl space-y-4 border border-cyan-500/50">
    <div class="flex justify-between items-center gap-2 border-b border-slate-800 pb-3 flex-wrap">
      <span class="text-xs font-mono text-yellow-400 bg-yellow-950/80 px-3 py-1 rounded border border-yellow-800">Pantalla ${S.i+1} de ${s.length}</span>
      <span class="text-xs font-mono text-cyan-300 bg-cyan-950 px-3 py-1 rounded border border-cyan-800">${esc(label)}</span>
    </div>
    ${bar(S.i + (done?1:0), s.length)}
    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center bg-slate-950/90 p-4 sm:p-5 rounded-2xl border border-cyan-500/30">
      <div class="md:col-span-4 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-800 pb-3 md:pb-0 md:pr-4">
        ${pybot("w-24 h-24 md:w-36 md:h-36")}
        <span class="text-xs font-mono font-bold text-cyan-400 mt-2">PyBot Tutor</span>
        <span class="text-[10px] text-slate-400 text-center">${status}</span>
      </div>
      <div class="md:col-span-8 space-y-3 min-w-0">${body}</div>
    </div>
    ${f && (st.t==="q"||st.t==="act") ? fbBox(f.good, f.msg) : ""}
    <div class="flex justify-between items-center pt-1">
      <button onclick="prev()" style="visibility:${S.i===0?"hidden":"visible"}" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-mono rounded-lg border border-slate-700"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
      <button onclick="next()" ${done?"":"disabled"} class="px-5 py-2.5 font-bold text-xs font-mono rounded-lg transition-all flex items-center gap-2 ${done?"bg-cyan-500 hover:bg-cyan-400 text-slate-950":"bg-slate-800 text-slate-500 cursor-not-allowed"}">${done?nextTxt:'<i class="fa-solid fa-lock"></i> Responde para continuar'}</button>
    </div>
  </div>`;
}

function win(){
  return `<div class="cyber-card cyber-card-glow max-w-3xl w-full p-6 sm:p-8 rounded-2xl space-y-6 text-center border border-amber-500/50">
    <div class="flex justify-center"><div class="w-40 animate-pop">${trophy("w-full")}</div></div>
    <div class="space-y-2"><h2 class="text-3xl font-extrabold text-amber-300">¡MISIÓN CUMPLIDA!</h2>
      <p class="text-slate-300 text-sm">Has recuperado el sistema de ingeniería.</p></div>
    <div class="flex justify-center gap-3 flex-wrap">${LV.map((L,i)=>`<div class="w-20 text-center">${medal(i,"w-full",false)}<p class="text-[10px] font-mono text-slate-300 mt-1">${esc(L.b)}</p></div>`).join("")}</div>
    <div class="speech-bubble p-5 text-left text-xs text-slate-200 leading-relaxed space-y-3">
      <p>¡Buen trabajo, ingeniero! La programación no consiste únicamente en escribir instrucciones: también requiere comprender problemas, organizar soluciones, analizar resultados y corregir errores.</p>
      <p>Estos fundamentos serán útiles para resolver problemas en cualquier área de la ingeniería.</p></div>
    <div class="flex gap-3 justify-center flex-wrap">
      <button onclick="go('map')" class="px-5 py-3 bg-slate-900 hover:bg-slate-800 text-cyan-300 text-xs font-mono rounded-lg border border-cyan-800"><i class="fa-solid fa-map"></i> Mapa de la misión</button>
      <a href="../index.html" class="px-5 py-3 bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-bold text-xs font-mono rounded-lg">Volver al inicio</a>
    </div></div>`;
}

/* ===================== INTERACCIÓN ===================== */
function pick(k, i){
  if (S.ok[k]) return;
  const r = getR(k), good = i === r.a;
  if (good) { S.ok[k] = true; save(); S.fb[k] = { good:true, msg:r.ok }; }
  else { (S.wr[k] = S.wr[k] || []).push(i); S.fb[k] = { good:false, msg:r.bad }; }
  render();
}
function mt2(li, ri, v){
  const k = li+".act", A = LV[li].act;
  if (S.ok[k]) return;
  S.sel[k] = S.sel[k] || [];
  S.sel[k][ri] = v === "" ? undefined : +v;
  const sel = S.sel[k];
  delete S.fb[k];
  if (A.rows.every((_,j)=>sel[j] !== undefined)) {
    const good = A.rows.every((row,j)=>sel[j] === row[1]);
    S.fb[k] = { good, msg: good ? A.ok : A.bad };
    if (good) { S.ok[k] = true; save(); }
  }
  render();
}
function oc(li, j){
  const k = li+".act", A = LV[li].act;
  if (S.ok[k]) return;
  const ord = (S.ord[k] = S.ord[k] || []);
  if (ord.includes(j)) return;
  delete S.fb[k];
  ord.push(j);
  if (ord.length === A.items.length) {
    const good = ord.every((v,n)=>v === n);
    if (good) { S.ok[k] = true; save(); S.fb[k] = { good:true, msg:A.ok }; }
    else { S.fb[k] = { good:false, msg:"El orden no es correcto. Revisa qué debe pasar primero y vuelve a intentarlo." }; S.ord[k] = []; }
  }
  render();
}
function orr(li){ const k = li+".act"; if (S.ok[k]) return; S.ord[k] = []; delete S.fb[k]; render(); }
function fc(li){
  const k = li+".act", A = LV[li].act;
  const raw = document.getElementById("fi").value || "";
  const v = raw.replace(/\s/g, "");
  S.fi[k] = raw;
  const good = v === A.ans.replace(/\s/g, "") || v === "30<=temperatura";
  S.fb[k] = { good, msg: good ? A.ok : A.bad };
  if (good) { S.ok[k] = true; save(); }
  render();
}

render();
</script>
</body>
</html>
